<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>German Article Trainer</title>
    <!-- ResponsiveVoice TTS - Key injected dynamically -->
    <script>
      // Inject ResponsiveVoice with secure key at runtime
      const rvKey = typeof __RESPONSIVE_VOICE_KEY__ !== 'undefined' ? __RESPONSIVE_VOICE_KEY__ : 'FREE_FOR_EDUCATIONAL_USE';
      const rvScript = document.createElement('script');
      rvScript.src = `https://code.responsivevoice.org/responsivevoice.js?key=${rvKey}`;
      document.head.appendChild(rvScript);
    </script>
  </head>
  <body class="bg-gray-900 text-white">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
